<!doctype html><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>NEON RIFT</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#050711;color:white;font-family:system-ui}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}.box{background:#080d1ddd;border:1px solid #ffffff25;padding:7px 10px;border-radius:10px;font-weight:800}.bar{width:140px;height:7px;background:#222;border-radius:9px}.fill{height:100%;background:#45e8ff;width:100%}#menu,#over{position:fixed;inset:0;display:grid;place-items:center;background:#02030bdd}#over{display:none}.panel{text-align:center;background:#080d1f;padding:30px;border:1px solid #ffffff22;border-radius:22px;width:min(650px,90vw)}h1{font-size:clamp(50px,12vw,100px);margin:0;background:linear-gradient(90deg,#45e8ff,#a46aff,#ff477d);color:transparent;background-clip:text}.btn{padding:14px 25px;border:0;border-radius:12px;background:#214b65;color:white;font-weight:900;font-size:17px}#touch{display:none;position:fixed;inset:0}.stick{position:absolute;bottom:25px;width:140px;height:140px;border:1px solid #fff2;border-radius:50%;background:#fff1}.l{left:20px}.r{right:20px}.fire{position:absolute;right:45px;bottom:195px;width:80px;height:80px;border-radius:50%;background:#ff477d55;color:white;border:1px solid #ff477d}.dash{position:absolute;right:145px;bottom:85px;width:60px;height:60px;border-radius:50%;background:#45e8ff33;color:white;border:1px solid #45e8ff}@media(pointer:coarse){#touch{display:block}}</style><canvas id=c></canvas><div id=ui><div class=box>SCORE <span id=s>0</span></div><div class=box>WAVE <span id=w>1</span></div><div class=box>LEVEL <span id=l>1</span><div class=bar><div class=fill id=x></div></div></div><div class=box>HULL <span id=h>100</span>%<div class=bar><div class=fill id=hp></div></div></div></div><div id=touch><div class="stick l" id=mv></div><div class="stick r" id=aim></div><button class=fire id=f>FIRE</button><button class=dash id=d>DASH</button></div><div id=menu><div class=panel><h1>NEON RIFT</h1><p>Fast browser arena shooter. Survive waves, level up and destroy elites.</p><p><b>PC:</b> WASD + mouse + click + Space<br><b>Mobile:</b> dual sticks + FIRE + DASH</p><button class=btn id=start>START GAME</button></div></div><div id=over><div class=panel><h2>GAME OVER</h2><p id=final></p><button class=btn id=retry>RETRY</button></div></div><script>
const c=document.getElementById('c'),q=c.getContext('2d');let W,H,run=0,last=0,keys={},m={x:0,y:0,down:0},p,en=[],bs=[],eb=[],parts=[],score,wave,timer,spawn,kills;
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;q.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
const R=(a,b)=>Math.random()*(b-a)+a,D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function reset(){p={x:W/2,y:H/2,r:14,hp:100,max:100,spd:250,ang:0,cd:0,rate:.15,dmg:25,bs:700,xp:0,next:100,lv:1,dash:0,inv:0};en=[];bs=[];eb=[];parts=[];score=0;wave=1;timer=0;spawn=0;kills=0;hud()}
function hud(){s.textContent=score;w.textContent=wave;l.textContent=p.lv;h.textContent=Math.ceil(p.hp);hp.style.width=p.hp/p.max*100+'%';x.style.width=p.xp/p.next*100+'%'}
function boom(x,y,col,n=10){for(let i=0;i<n;i++){let a=R(0,Math.PI*2),v=R(1,4);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.5,col})}}
function enemy(){let z=Math.floor(R(0,4)),x=z<2?R(-30,W+30):z==2?-30:W+30,y=z<2?(z?-30:H+30):R(-30,H+30),elite=Math.random()<.12+wave*.008;en.push({x,y,r:elite?21:13,hp:(elite?150:55)+wave*7,max:0,spd:elite?55:R(70,115),elite,cd:R(.5,2),sh:Math.random()<.2});en.at(-1).max=en.at(-1).hp}
function shoot(){if(p.cd>0)return;p.cd=p.rate;let a=p.ang;bs.push({x:p.x,y:p.y,vx:Math.cos(a)*p.bs,vy:Math.sin(a)*p.bs,t:1,d:p.dmg})}
function hurt(n){if(p.inv>0)return;p.hp-=n;p.inv=.3;boom(p.x,p.y,'#ff477d',7);if(p.hp<=0){run=0;over.style.display='grid';final.innerHTML='Score <b>'+score+'</b> · Wave <b>'+wave+'</b> · Level <b>'+p.lv+'</b>'}}
function gain(n){p.xp+=n;if(p.xp>=p.next){p.xp-=p.next;p.next*=1.3;p.lv++;p.dmg*=1.15;p.rate*=.93}}
function update(dt){if(!run)return;dt=Math.min(dt,.03);timer+=dt;spawn-=dt;p.cd-=dt;p.inv-=dt;p.dash-=dt;if(timer>25){wave++;timer=0}if(spawn<=0){spawn=Math.max(.15,.8-wave*.03);enemy()}
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),z=Math.hypot(mx,my)||1;p.x=cl(p.x+mx/z*p.spd*dt,20,W-20);p.y=cl(p.y+my/z*p.spd*dt,20,H-20);if(m.x||m.y)p.ang=Math.atan2(m.y-p.y,m.x-p.x);if(m.down)shoot();
for(let b of bs){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt}for(let b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(D(b,p)<p.r+5){b.t=0;hurt(10)}}bs=bs.filter(b=>b.t>0);eb=eb.filter(b=>b.t>0);
for(let e of en){let a=Math.atan2(p.y-e.y,p.x-e.x),d=D(e,p);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;e.cd-=dt;if(e.sh&&e.cd<0&&d<450){eb.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,t:3});e.cd=R(1,2)}if(d<e.r+p.r)hurt(14*dt)}
for(let b of bs)for(let e of en)if(e.hp>0&&D(b,e)<e.r+4){e.hp-=b.d;b.t=0;if(e.hp<=0){score+=e.elite?250:100;kills++;gain(e.elite?30:15);boom(e.x,e.y,e.elite?'#ff477d':'#45e8ff',15)}}
en=en.filter(e=>e.hp>0);for(let a of parts){a.x+=a.vx*dt*50;a.y+=a.vy*dt*50;a.t-=dt}parts=parts.filter(a=>a.t>0);hud()}
function draw(){q.fillStyle='#050711';q.fillRect(0,0,W,H);q.strokeStyle='#ffffff09';for(let X=0;X<W;X+=45){q.beginPath();q.moveTo(X,0);q.lineTo(X,H);q.stroke()}for(let Y=0;Y<H;Y+=45){q.beginPath();q.moveTo(0,Y);q.lineTo(W,Y);q.stroke()}for(let b of bs){q.strokeStyle='#45e8ff';q.lineWidth=3;q.beginPath();q.moveTo(b.x,b.y);q.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);q.stroke()}for(let b of eb){q.fillStyle='#ff477d';q.beginPath();q.arc(b.x,b.y,5,0,7);q.fill()}for(let e of en){q.save();q.translate(e.x,e.y);q.rotate(Math.atan2(p.y-e.y,p.x-e.x));q.fillStyle=e.elite?'#ff477d':'#a46aff';q.shadowBlur=18;q.shadowColor=q.fillStyle;q.beginPath();q.moveTo(e.r,0);q.lineTo(-e.r,e.r*.7);q.lineTo(-e.r,-e.r*.7);q.fill();q.restore()}for(let a of parts){q.globalAlpha=a.t*2;q.fillStyle=a.col;q.fillRect(a.x,a.y,3,3)}q.globalAlpha=1;q.save();q.translate(p.x,p.y);q.rotate(p.ang);q.fillStyle='#45e8ff';q.shadowBlur=22;q.shadowColor='#45e8ff';q.beginPath();q.moveTo(20,0);q.lineTo(-13,11);q.lineTo(-7,0);q.lineTo(-13,-11);q.fill();q.restore()}
function loop(t){let dt=(t-last)/1000||0;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function startGame(){reset();run=1;menu.style.display='none';over.style.display='none'}start.onclick=startGame;retry.onclick=startGame;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'&&p.dash<=0){let a=p.ang;p.x=cl(p.x+Math.cos(a)*130,20,W-20);p.y=cl(p.y+Math.sin(a)*130,20,H-20);p.dash=1.2;p.inv=.3}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
c.onmousemove=e=>{m.x=e.clientX;m.y=e.clientY};c.onmousedown=()=>m.down=1;addEventListener('mouseup',()=>m.down=0);f.onpointerdown=()=>m.down=1;f.onpointerup=()=>m.down=0;d.onclick=()=>{if(p.dash<=0){let a=p.ang;p.x=cl(p.x+Math.cos(a)*130,20,W-20);p.y=cl(p.y+Math.sin(a)*130,20,H-20);p.dash=1.2;p.inv=.3}};
function stick(el,cb){let on=0,sx,sy;el.onpointerdown=e=>{on=1;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(on)cb(e.clientX-sx,e.clientY-sy)};el.onpointerup=()=>{on=0;cb(0,0)}}stick(mv,(x,y)=>{keys.a=x<-15;keys.d=x>15;keys.w=y<-15;keys.s=y>15});stick(aim,(x,y)=>{if(Math.hypot(x,y)>10){p.ang=Math.atan2(y,x);m.down=1}else m.down=0});
reset();</script>
