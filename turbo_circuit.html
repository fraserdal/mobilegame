<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turbo Circuit</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:bold}.box{background:#000b;padding:9px 12px;border-radius:12px}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}.ctrl,.nitro{color:#fff;background:#111c;border:2px solid #fff5;font-weight:bold;touch-action:none}.ctrl{width:72px;height:72px;border-radius:50%;font-size:28px}.nitro{width:95px;height:60px;border-radius:16px}.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center}.card{width:min(90%,430px);padding:28px;text-align:center;background:#151e28;border-radius:24px}.big{padding:14px 28px;border:0;border-radius:14px;background:#e63946;font-size:18px}#finish{display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="box">LAP <span id="lap">1/3</span></div><div class="box"><span id="speed">0</span> KM/H</div><div class="box">POS <span id="pos">1/6</span></div></div><div id="controls"><div><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="nitro" id="nitro">NITRO</button></div><div class="overlay" id="start"><div class="card"><h1>🏁 TURBO CIRCUIT</h1><p>Race 3 laps against 5 AI drivers.</p><p>PC: Arrow keys / A-D<br>Mobile: on-screen controls</p><button class="big" id="startBtn">START RACE</button></div></div><div class="overlay" id="finish"><div class="card"><h1 id="result">🏆 FINISH!</h1><p id="resultText"></p><button class="big" id="again">RACE AGAIN</button></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const keys={left:false,right:false,nitro:false};function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[k]=false}))}bind('left','left');bind('right','right');bind('nitro','nitro');onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key==='Shift'||e.key===' ')keys.nitro=true};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.key==='Shift'||e.key===' ')keys.nitro=false};const pts=[[.50,.16],[.72,.19],[.87,.35],[.88,.62],[.71,.82],[.49,.87],[.27,.80],[.13,.62],[.12,.37],[.28,.20]];function P(i){let p=pts[(i+pts.length)%pts.length];return{x:p[0]*W,y:p[1]*H}}function track(t){let n=pts.length,u=t*n,i=Math.floor(u),f=u-i,a=P(i-1),b=P(i),cc=P(i+1),d=P(i+2),q=f*f,q3=q*f;return{x:.5*(2*b.x+(-a.x+cc.x)*f+(2*a.x-5*b.x+4*cc.x-d.x)*q+(-a.x+3*b.x-3*cc.x+d.x)*q3),y:.5*(2*b.y+(-a.y+cc.y)*f+(2*a.y-5*b.y+4*cc.y)*q+(-a.y+3*b.y-3*cc.y+d.y)*q3)}}let player,ai,running=false,last=0,count=3;function makeCar(t,color,skill=1){return{t,color,skill,speed:0,lap:0,old:t}}function reset(){player=makeCar(.02,'#e63946');ai=[makeCar(.01,'#42a5f5',.93),makeCar(.005,'#ffd166',.91),makeCar(.995,'#9b5de5',.88),makeCar(.99,'#06d6a0',.85),makeCar(.985,'#f4a261',.82)];running=true;count=3;last=performance.now();document.getElementById('finish').style.display='none';requestAnimationFrame(loop)}function drawTrack(){ctx.fillStyle='#172018';ctx.fillRect(0,0,W,H);function stroke(w,col){ctx.beginPath();for(let i=0;i<=500;i++){let p=track(i/500);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath();ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}stroke(Math.min(W,H)*.31,'#20252a');stroke(Math.min(W,H)*.245,'#555b61');stroke(Math.min(W,H)*.235,'#343a40');stroke(5,'#eee');ctx.setLineDash([14,18]);stroke(2,'#ffffff55');ctx.setLineDash([])}function drawCar(o){let p=track(o.t),q=track((o.t+.002)%1),a=Math.atan2(q.y-p.y,q.x-p.x);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,7,16,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=o.color;ctx.roundRect(-11,-19,22,38,5);ctx.fill();ctx.fillStyle='#111';ctx.roundRect(-7,-11,14,11,3);ctx.fill();ctx.fillStyle='#dff';ctx.roundRect(-6,-9,12,6,2);ctx.fill();if(o===player&&keys.nitro){ctx.fillStyle='#ffae00';ctx.beginPath();ctx.moveTo(-6,19);ctx.lineTo(0,38);ctx.lineTo(6,19);ctx.fill()}ctx.restore()}function update(dt){if(count>0){count-=dt;return}let target=keys.nitro?2.15:1.45;player.speed+=(target-player.speed)*3*dt;if(keys.left)player.t-=.00095*dt*60*(.7+player.speed);if(keys.right)player.t+=.00095*dt*60*(.7+player.speed);player.t=(player.t%1+1)%1;if(player.t<.03&&player.old>.95)player.lap++;player.old=player.t;player.t=(player.t+player.speed*dt*.00045)%1;ai.forEach(o=>{let old=o.t;o.speed+=(1.1*o.skill-o.speed)*1.8*dt;o.t=(o.t+o.speed*dt*.00048)%1;if(o.t<.03&&old>.95)o.lap++});let all=[player,...ai].sort((a,b)=>(b.lap+b.t)-(a.lap+a.t));document.getElementById('pos').textContent=(all.indexOf(player)+1)+'/6';document.getElementById('lap').textContent=Math.min(player.lap+1,3)+'/3';document.getElementById('speed').textContent=Math.round(player.speed*145);if(player.lap>=3)finish()}function finish(){running=false;let p=+document.getElementById('pos').textContent.split('/')[0];document.getElementById('result').textContent=p===1?'🏆 YOU WIN!':'🏁 FINISH!';document.getElementById('resultText').textContent='You finished '+p+' out of 6.';document.getElementById('finish').style.display='flex'}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);drawTrack();ai.forEach(drawCar);drawCar(player);if(count>0){ctx.fillStyle='#fff';ctx.font='900 80px Arial';ctx.textAlign='center';ctx.fillText(count<1?'GO!':Math.ceil(count),W/2,H/2)}requestAnimationFrame(loop)}document.getElementById('startBtn').onclick=()=>{document.getElementById('start').style.display='none';reset()};document.getElementById('again').onclick=reset;drawTrack();</script></body></html>
